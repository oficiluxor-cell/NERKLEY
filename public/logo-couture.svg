<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="highBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#15151a"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>

    <linearGradient id="pureGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FCE69B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA821C"/>
      <stop offset="100%" stop-color="#F4D87E"/>
    </linearGradient>

    <linearGradient id="cyberDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7B5B0D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#highBg)"/>
  
  <g transform="translate(256, 225)">
    <!-- Letra N de Alta Costura: Finura extrema & Geometría pura -->
    <!-- Columna vertical izquierda -->
    <rect x="-110" y="-140" width="28" height="280" rx="4" fill="url(#pureGold)"/>
    
    <!-- Diagonal cortada con precisión láser -->
    <polygon points="-110,-140 -70,-140 110,140 70,140" fill="url(#cyberDiagonal)"/>

    <!-- Columna vertical derecha -->
    <rect x="82" y="-140" width="28" height="280" rx="4" fill="url(#pureGold)"/>

    <!-- Acento horizontal superior minimalista -->
    <rect x="-110" y="-155" width="220" height="4" fill="url(#pureGold)" opacity="0.6"/>
  </g>

  <text x="256" y="445" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#pureGold)" letter-spacing="12" text-anchor="middle">
    NERKLEY
  </text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#666677" letter-spacing="6" text-anchor="middle">
    EST. 2026 &bull; CONCEPT STORE
  </text>
</svg>
