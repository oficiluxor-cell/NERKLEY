<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="boxBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#191924"/>
      <stop offset="60%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#030305"/>
    </radialGradient>

    <linearGradient id="goldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D5"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#AC7F18"/>
      <stop offset="100%" stop-color="#EED57D"/>
    </linearGradient>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#boxBg)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#goldBox)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Icono de Caja de Boutique de Lujo / Paquete Exclusivo de Compras -->
  <g filter="url(#boxShadow)" transform="translate(256, 235)">
    <!-- Tapa de la Caja de Regalo / Boutique con bisel 3D -->
    <path d="M 0 -130 L 140 -65 L 0 0 L -140 -65 Z" fill="#14141c" stroke="url(#goldBox)" stroke-width="3"/>
    
    <!-- Lado Izquierdo de la Caja -->
    <path d="M -140 -65 L 0 0 L 0 140 L -140 75 Z" fill="#0b0b10" stroke="url(#goldBox)" stroke-width="3"/>

    <!-- Lado Derecho de la Caja -->
    <path d="M 0 0 L 140 -65 L 140 75 L 0 140 Z" fill="#111118" stroke="url(#goldBox)" stroke-width="3"/>

    <!-- Cinta de Regalo / Lazo de Oro Líquido Vertical -->
    <path d="M 0 -130 L 0 0 L 0 140" fill="none" stroke="url(#goldBox)" stroke-width="20"/>

    <!-- Cinta de Oro Horizontal Izquierda -->
    <path d="M -140 7 L 0 72" fill="none" stroke="url(#goldBox)" stroke-width="16" opacity="0.9"/>
    
    <!-- Cinta de Oro Horizontal Derecha -->
    <path d="M 0 72 L 140 7" fill="none" stroke="url(#goldBox)" stroke-width="16" opacity="0.9"/>

    <!-- Lazo / Moño Superior en Forma de Corona / N -->
    <circle cx="0" cy="-130" r="14" fill="#FFFFFF"/>
    <path d="M -40 -155 C -60 -195, 0 -170, 0 -130 C 0 -170, 60 -195, 40 -155" fill="none" stroke="url(#goldBox)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Tipografía Play Store -->
  <text x="256" y="445" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#goldBox)" letter-spacing="12" text-anchor="middle">
    NERKLEY
  </text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#E5C158" letter-spacing="6" text-anchor="middle">
    LUXURY BOUTIQUE
  </text>
</svg>
