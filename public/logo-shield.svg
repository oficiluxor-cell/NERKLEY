<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="shieldBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c1b22"/>
      <stop offset="60%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#030305"/>
    </radialGradient>

    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="35%" stop-color="#E1BA4B"/>
      <stop offset="65%" stop-color="#AD821E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="goldMetallic" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F3D372"/>
      <stop offset="80%" stop-color="#8F6810"/>
      <stop offset="100%" stop-color="#553D07"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle estándar Google Play (512x512) -->
  <rect width="512" height="512" rx="112" fill="url(#shieldBg)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#shieldGold)" stroke-width="2" stroke-opacity="0.3"/>

  <g transform="translate(256, 235)">
    <!-- Escudo Hexagonal Pulido Exterior -->
    <polygon points="0,-165 145,-80 145,85 0,170 -145,85 -145,-80" fill="#0d0d12" stroke="url(#shieldGold)" stroke-width="5"/>
    <polygon points="0,-145 125,-70 125,75 0,150 -125,75 -125,-70" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- 'N' Arquitectónica estilizada inscrita en el hexágono -->
    <!-- Columna Izquierda -->
    <path d="M -75 -90 L -35 -90 L -35 90 L -75 90 Z" fill="url(#shieldGold)"/>

    <!-- Diagonal dinámica -->
    <path d="M -35 -90 L 0 -90 L 35 90 L 0 90 Z" fill="url(#goldMetallic)"/>

    <!-- Columna Derecha -->
    <path d="M 35 -90 L 75 -90 L 75 90 L 35 90 Z" fill="url(#shieldGold)"/>

    <!-- Corona / Diamante en Vértice -->
    <circle cx="0" cy="-105" r="7" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Tipografía Play Store -->
  <text x="256" y="445" font-family="'Cinzel', 'Didot', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#shieldGold)" letter-spacing="12" text-anchor="middle">
    NERKLEY
  </text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#7d7d8e" letter-spacing="5" text-anchor="middle">
    HAUTE COUTURE &bull; 1.1
  </text>
</svg>
