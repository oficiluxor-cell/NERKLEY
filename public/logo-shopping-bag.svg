<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="storeBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="60%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Gradiente Oro 24K Pulido -->
    <linearGradient id="goldBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#B88A1A"/>
      <stop offset="75%" stop-color="#EED57D"/>
      <stop offset="100%" stop-color="#84600C"/>
    </linearGradient>

    <linearGradient id="goldHandles" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B88A1A"/>
    </linearGradient>

    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E5C158" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle Play Store (512x512) -->
  <rect width="512" height="512" rx="112" fill="url(#storeBg)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#goldBag)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Icono Central: Bolsa de Compras de Boutique de Lujo -->
  <g filter="url(#bagShadow)" transform="translate(256, 245)">
    <!-- Asas de la Bolsa (Curvas metálicas de oro pulido) -->
    <!-- Asa Trasera -->
    <path d="M -50 -70 C -50 -150, 50 -150, 50 -70" fill="none" stroke="url(#goldBag)" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <!-- Asa Delantera -->
    <path d="M -42 -70 C -42 -145, 42 -145, 42 -70" fill="none" stroke="url(#goldHandles)" stroke-width="12" stroke-linecap="round"/>

    <!-- Cuerpo de la Bolsa de Boutique -->
    <path d="M -130 -65 L 130 -65 L 115 135 L -115 135 Z" fill="#0e0e14" stroke="url(#goldBag)" stroke-width="4"/>
    
    <!-- Pliegue de relieve y profundidad de boutique -->
    <path d="M -115 135 L 0 115 L 115 135" fill="none" stroke="url(#goldBag)" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 0 -65 L 0 115" fill="none" stroke="url(#goldBag)" stroke-width="1" stroke-opacity="0.2"/>

    <!-- Letra 'N' Monograma en el Centro de la Bolsa -->
    <!-- Columna Izquierda -->
    <path d="M -42 -15 L -20 -15 L -20 65 L -42 65 Z" fill="url(#goldBag)"/>
    <!-- Diagonal -->
    <path d="M -20 -15 L 0 -15 L 20 65 L 0 65 Z" fill="url(#goldHandles)"/>
    <!-- Columna Derecha -->
    <path d="M 20 -15 L 42 -15 L 42 65 L 20 65 Z" fill="url(#goldBag)"/>

    <!-- Etiqueta de Autenticidad Colgante (Tag de Lujo 1.1) -->
    <line x1="-90" y1="-65" x2="-105" y2="-15" stroke="url(#goldBag)" stroke-width="2"/>
    <rect x="-115" y="-15" width="22" height="34" rx="3" fill="#14141c" stroke="url(#goldBag)" stroke-width="1.5"/>
    <circle cx="-104" cy="-5" r="2.5" fill="#FFFFFF"/>
    <line x1="-111" y1="5" x2="-97" y2="5" stroke="url(#goldBag)" stroke-width="1"/>
    <line x1="-111" y1="10" x2="-100" y2="10" stroke="url(#goldBag)" stroke-width="1"/>
  </g>

  <!-- Tipografía Comercial Play Store -->
  <text x="256" y="445" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#goldBag)" letter-spacing="12" text-anchor="middle">
    NERKLEY
  </text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#E5C158" letter-spacing="6" text-anchor="middle">
    STORE &bull; SHOPPING
  </text>
</svg>
